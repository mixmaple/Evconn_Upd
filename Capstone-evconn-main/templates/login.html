{% extends "base.html" %}
{% set title = "Login Dashboard" %}
{% set favicon = url_for('static', filename='icons/dashboard.svg') %}

{% block content %}
<section class="auth-layout">
  <div class="auth-panel">
    <p class="eyebrow">Dashboard admin</p>
    <h1>Masuk untuk mengelola konten home.</h1>
    <form class="form-stack" method="post">
      <label>
        Username
        <input type="text" name="username" autocomplete="username" required>
      </label>
      <label>
        Password
        <span class="password-field">
          <input id="password" type="password" name="password" autocomplete="current-password" required>
          <button class="password-toggle" type="button" aria-label="Tampilkan password" aria-pressed="false" data-password-toggle>
            <svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg class="icon-eye-off" viewBox="0 0 24 24" aria-hidden="true">
              <path d="m3 3 18 18"/>
              <path d="M10.6 10.6A2 2 0 0 0 12 14a2 2 0 0 0 1.4-.6"/>
              <path d="M9.4 5.5A9.8 9.8 0 0 1 12 5c6 0 9.5 7 9.5 7a16.8 16.8 0 0 1-3.1 4"/>
              <path d="M6.5 6.5A16.5 16.5 0 0 0 2.5 12s3.5 7 9.5 7a9.9 9.9 0 0 0 4.1-.9"/>
            </svg>
          </button>
        </span>
      </label>
      <button class="button button-primary" type="submit">Login</button>
    </form>
  </div>
</section>
{% endblock %}
